<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Film grain: fractal noise, desaturated, tiled seamlessly (stitchTiles).
       The page is one flat near-black field, which is most of why it reads as
       machine-made; grain is the cheapest thing that gives it a surface. -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.55"/>
</svg>
