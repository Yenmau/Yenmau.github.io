<svg xmlns="http://www.w3.org/2000/svg" width="240" height="16" viewBox="0 0 240 16" fill="none">
  <!-- one tile of the razor-wire rule.
       Drawn in the page's own geometry: a straight strand, chevron twists and
       square-set barbs — no smooth curve, so it reads as part of the
       rectilinear system instead of an ornament laid on top. -->
