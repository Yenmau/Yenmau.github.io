  <path d="M112 8 120 3.5 128 8" stroke="#33414f" stroke-width="1" stroke-linecap="square"/>
  <g stroke="#5eead4" stroke-width="1.1" stroke-linecap="square" opacity="0.6">
    <path d="M52 2 68 14M68 2 52 14"/>
    <path d="M172 2 188 14M188 2 172 14"/>
  </g>
  <g stroke="#4b5a6d" stroke-width="1" stroke-linecap="square">
    <path d="M60 4v2M60 10v2M180 4v2M180 10v2"/>
  </g>
</svg>
